name: import-upstream

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Preset project, or custom'
        required: true
        default: mamba
        type: choice
        options:
          - mamba
          - deepseek-v3
          - deepseek-r1
          - flash-attention
          - vllm
          - custom
      url:
        description: 'Required only when project=custom. Example: https://github.com/org/repo.git'
        required: false
        type: string
      family:
        description: 'Required only when project=custom. Example: moe, dense-transformer, multimodal, inference'
        required: false
        type: string
      name:
        description: 'Required only when project=custom. Example: deepseek-v4'
        required: false
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Import selected upstream
        run: |
          if [[ "${{ inputs.project }}" == "custom" ]]; then
            bash scripts/import_upstream.sh custom "${{ inputs.url }}" "${{ inputs.family }}" "${{ inputs.name }}"
          else
            bash scripts/import_upstream.sh "${{ inputs.project }}"
          fi

      - name: Show import diff summary
        run: git status --short

      - name: Commit and push import
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git add vendor scripts .github README.md LICENSE
          git commit -m "Import upstream architecture: ${{ inputs.project }}"
          git push
