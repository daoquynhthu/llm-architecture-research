# Frontier model architecture archive manifest.
# This file records architecture sources, import status, and license boundaries.
# It is not a claim that all listed projects have already been mirrored.

schema_version: 0.1
repository_license: Apache-2.0
policy:
  third_party_code: preserve_upstream_license
  model_weights: do_not_mirror_by_default
  datasets: do_not_mirror_by_default
  generated_cleanroom_code: Apache-2.0

families:
  dense_decoder_transformer:
    description: Dense autoregressive Transformer architectures.
    targets:
      - id: llama_family
        upstream: https://github.com/meta-llama/llama
        status: reference_only
        notes: LLaMA-family decoder-only Transformer lineage; weights and code terms must be checked per release.
      - id: qwen_family
        upstream: https://github.com/QwenLM/Qwen
        status: reference_only
        notes: Qwen-family dense and MoE models; verify repository-specific license and model card terms.
      - id: mistral_family
        upstream: https://github.com/mistralai/mistral-src
        status: reference_only
        notes: Mistral-family architecture references; preserve upstream license on import.

  mixture_of_experts:
    description: Sparse MoE routing, expert parallelism, and auxiliary-loss/free-load-balancing variants.
    targets:
      - id: mixtral_family
        upstream: https://github.com/mistralai/mistral-src
        status: reference_only
        notes: Sparse MoE decoder architecture; good target for routing benchmarks.
      - id: deepseek_moe_family
        upstream: https://github.com/deepseek-ai/DeepSeek-V3
        status: reference_only
        notes: DeepSeek-style MoE and MLA-like attention mechanisms; verify original code license before mirroring.
      - id: switch_transformer
        upstream: https://github.com/google-research/google-research/tree/master/switch_transformer
        status: reference_only
        notes: Historical MoE baseline; useful for taxonomy and routing comparison.

  attention_variants:
    description: Variants of attention factorization, cache reduction, and long-context mechanisms.
    targets:
      - id: flash_attention
        upstream: https://github.com/Dao-AILab/flash-attention
        status: reference_only
        notes: Kernel/system component rather than a full model architecture; relevant for inference experiments.
      - id: xformers
        upstream: https://github.com/facebookresearch/xformers
        status: reference_only
        notes: Attention building blocks; import only with license preserved.

  state_space_and_hybrid:
    description: Selective SSM, recurrent-hybrid, and Transformer-SSM hybrid architectures.
    targets:
      - id: mamba
        upstream: https://github.com/state-spaces/mamba
        status: reference_only
        notes: Selective state-space model architecture.
      - id: rwkv
        upstream: https://github.com/BlinkDL/RWKV-LM
        status: reference_only
        notes: Recurrent weighted key-value architecture.
      - id: jamba
        upstream: https://github.com/AI21Labs/Jamba
        status: reference_only
        notes: Hybrid Transformer/Mamba-like architecture; check upstream license before import.

  inference_systems:
    description: Runtime and inference architecture components.
    targets:
      - id: vllm
        upstream: https://github.com/vllm-project/vllm
        status: reference_only
        notes: PagedAttention and serving architecture.
      - id: sglang
        upstream: https://github.com/sgl-project/sglang
        status: reference_only
        notes: Inference runtime and structured generation system.
